id: postgresql
display_name: PostgreSQL
color: "#336791"

docker:
  image: postgres:17
  container_name: showdown-postgresql
  environment:
    POSTGRES_DB: hits
    POSTGRES_USER: bench_user
    POSTGRES_PASSWORD: bench_pass
  ports:
    "5432": 5432
  volumes:
    showdown-postgresql-data: /var/lib/postgresql/data
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U bench_user -d hits"]
    interval: 5
    timeout: 5
    retries: 20
  command: >-
    postgres
    -c max_connections=50
    -c shared_buffers=2GB
    -c effective_cache_size=6GB
    -c work_mem=256MB
    -c maintenance_work_mem=1GB
    -c wal_level=minimal
    -c max_wal_senders=0
    -c checkpoint_completion_target=0.9
    -c random_page_cost=1.1
    -c effective_io_concurrency=200
    -c min_wal_size=2GB
    -c max_wal_size=8GB

connection:
  protocol: asyncpg
  host: showdown-postgresql
  port: 5432
  user: bench_user
  password: bench_pass
  database: hits

clickbench_repo_path: postgresql
row_count_query: "SELECT count(*) FROM hits"
