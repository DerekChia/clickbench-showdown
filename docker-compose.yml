services:

  # ── Data loader ──────────────────────────────────────────────────────────────
  # Downloads parquet files and loads data into databases on demand.
  loader:
    build: ./loader
    container_name: showdown-loader
    environment:
      PARQUET_FILES: ${PARQUET_FILES:-1}
      INSERT_WORKERS: ${INSERT_WORKERS:-}
    volumes:
      - ./tmp:/tmp/hits_parquet
      - ./databases:/app/databases:ro
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  # ── Backend API ─────────────────────────────────────────────────────────────
  # FastAPI app: benchmark runner, status poller, DB management.
  backend:
    build: ./backend
    container_name: showdown-backend
    environment:
      DATABASES_DIR: /app/databases
      DOCKER_NETWORK: showdown-net
      # Default file count offered in the dashboard picker. Mirrors --files.
      PARQUET_FILES: ${PARQUET_FILES:-1}
    volumes:
      - ./databases:/app/databases:ro
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"
    restart: unless-stopped

  # ── Dashboard ───────────────────────────────────────────────────────────────
  dashboard:
    build: ./dashboard
    container_name: showdown-dashboard
    ports:
      - "3000:80"
    restart: unless-stopped

# Explicit network name so DB containers created via the Docker SDK can always
# find it — the default `<project>_default` name depends on the directory name,
# which breaks the moment the repo is cloned into a differently-named folder.
networks:
  default:
    name: showdown-net
